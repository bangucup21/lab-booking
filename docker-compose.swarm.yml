# ──────────────────────────────────────────────────────────────────
# CATATAN PERUBAHAN dari versi asli:
# - "environment:" sekarang lengkap (sebelumnya cuma APP_ENV & APP_DEBUG).
#   env_file TIDAK didukung oleh `docker stack deploy`, jadi semua
#   variable ditulis eksplisit di sini pakai ${VAR}. Docker CLI akan
#   otomatis substitusi nilainya dari file ".env" yang ada di folder
#   yang sama saat kamu jalankan `docker stack deploy`.
# - Service baru "lab_reverb" ditambahkan — pakai image yang SAMA
#   dengan app (iswant/lab-management:v2.10.1), cuma override command.
#   Tidak perlu image/Dockerfile terpisah, tidak perlu vendor volume.
# - FIX (2026-07-08): lab_nginx dan lab_app adalah container terpisah,
#   sehingga nginx tidak punya akses ke folder /var/www/html/public milik
#   lab_app (404 karena folder itu tidak ada di container lab_nginx).
#   Solusi: volume baru "lab_public" di-share antara lab_app dan lab_nginx.
#   lab_app meng-copy isi public/ miliknya ke volume itu setiap kali start
#   (karena named volume kosong akan menimpa isi folder image saat mount).
# - FIX (2026-07-16): Logo/attachment 404 di nginx. Root cause: folder
#   public/storage (symlink hasil `php artisan storage:link`) TIDAK PERNAH
#   dibuat sama sekali di container manapun (dikonfirmasi lewat
#   `ls -la public/ | grep storage` kosong di lab_app maupun lab_nginx).
#   Solusi 2 bagian:
#     1) Tambahkan `php artisan storage:link` di command lab_app SEBELUM
#        proses cp -r ke /shared-public, supaya symlink-nya ikut ter-copy.
#     2) Mount volume lab_storage ke lab_nginx juga (read-only), karena
#        symlink public/storage menunjuk ke ../storage/app/public — target
#        itu harus benar-benar ada di filesystem container nginx, bukan
#        cuma di lab_app.
# ──────────────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Lab Management}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  DEBUGBAR_ENABLED: "false"
  APP_URL: ${APP_URL}

  TELESCOPE_ENABLED: ${TELESCOPE_ENABLED:-false}
  TELESCOPE_PRUNE_HOURS: ${TELESCOPE_PRUNE_HOURS:-12}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-error}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-lab_management}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD}

  DB_FINANCE_DATABASE: ${DB_FINANCE_DATABASE:-finance}
  DB_FINANCE_USERNAME: ${DB_FINANCE_USERNAME:-laravel}
  DB_FINANCE_PASSWORD: ${DB_FINANCE_PASSWORD}

  BROADCAST_DRIVER: reverb
  CACHE_DRIVER: redis
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}

  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: 6379
  REDIS_DB: ${REDIS_DB:-2}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-3}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Lab Management}

  MIKROTIK_HOST: ${MIKROTIK_HOST}
  MIKROTIK_PORT: ${MIKROTIK_PORT:-2112}
  MIKROTIK_USER: ${MIKROTIK_USER:-admin}
  MIKROTIK_PASS: ${MIKROTIK_PASS}

  BAILEYS_URL: ${BAILEYS_URL}
  BAILEYS_API_KEY: ${BAILEYS_API_KEY}
  BOT_URL: ${BOT_URL}
  BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL}
  BOT_TOKEN: ${BOT_TOKEN}

  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: lab_reverb
  REVERB_PORT: 8082
  REVERB_SCHEME: http

services:
  # ─── PHP-FPM Laravel App ────────────────────────────────────────
  lab_app:
    image: iswant/lab-management:v2.10.1
    user: "0:0"
    entrypoint: [""]
    command: >
      sh -c "php artisan storage:link &&
             cp -r /var/www/html/public/. /shared-public/ &&
             chmod -R 755 /shared-public &&
             php artisan config:cache && php artisan route:cache &&
             php artisan view:cache && php artisan event:cache &&
             php-fpm"
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - lab_storage:/var/www/html/storage
      - lab_public:/shared-public
    networks:
      - lab_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Queue Worker ────────────────────────────────────────────────
  lab_queue:
    image: iswant/lab-management:v2.10.1
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    entrypoint: [""]
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
    volumes:
      - lab_storage:/var/www/html/storage
    networks:
      - lab_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Reverb WebSocket (pakai image app yang sama) ───────────────
  lab_reverb:
    image: iswant/lab-management:v2.10.1
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    entrypoint: [""]
    command: php artisan reverb:start --host=0.0.0.0 --port=8082 --no-interaction
    networks:
      - lab_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Nginx Web Server ────────────────────────────────────────────
  lab_nginx:
    image: nginx:1.27-alpine
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - ./docker/nginx/default.swarm.conf:/etc/nginx/conf.d/default.conf:ro
      - lab_public:/var/www/html/public
      - lab_storage:/var/www/html/storage:ro
    networks:
      - lab_network
      - shared_network
    depends_on:
      - lab_app
      - lab_reverb

volumes:
  lab_storage:
    name: lab_storage
    driver: local
    # NOTE: 'local' aman untuk saat ini karena lab_app/lab_queue/lab_reverb/
    # lab_nginx semua di-constraint ke node worker YANG SAMA (cuma ada 1
    # worker: laravel). Kalau nanti nambah worker node lagi, ganti ke
    # shared storage (NFS/Ceph) atau tambahkan node label constraint
    # yang spesifik supaya semua service tetap di node yang sama.
  lab_public:
    name: lab_public
    driver: local
    # Volume ini di-share antara lab_app dan lab_nginx supaya nginx bisa
    # menemukan index.php dan asset public lainnya. lab_app meng-copy isi
    # public/ ke sini setiap kali container start (lihat command di atas),
    # termasuk symlink public/storage hasil `php artisan storage:link`.
    # Sama seperti lab_storage: aman selama semua service masih di 1 worker node.

networks:
  lab_network:
    name: lab_network
    driver: overlay
    attachable: true
  shared_network:
    name: shared_network
    driver: overlay
    attachable: true
    external: true
