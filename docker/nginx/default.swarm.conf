server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Upload limit — harus >= post_max_size di php-prod.ini (20M)
    # Diset 25M untuk memberi sedikit ruang di atas batas PHP
    client_max_body_size 25M;

    # ── Docker embedded DNS resolver ──────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        application/x-font-truetype
        image/svg+xml
        image/x-icon
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # ── Routes ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Vite build assets ─────────────────────────────────────────
    location ^~ /build/ {
        expires max;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Static assets ─────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|webp|woff|woff2|ttf|otf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # ── Dashboard React Siswa ────────────────────────────────────
    # (nama path sengaja dijauhkan dari kata "app" — /app* ternyata
    # di-intercept di level Cloudflare, di luar kendali server ini)
    location ^~ /siswa/ {
        alias /var/www/html/public/siswa/;
        try_files $uri $uri/ /siswa/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Dashboard React Guru ─────────────────────────────────────
    location ^~ /guru/ {
        alias /var/www/html/public/guru/;
        try_files $uri $uri/ /guru/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── Proxy Reverb WebSocket ────────────────────────────────────
    # Client kirim: /ws/app/{key}?protocol=7...
    # REVERB SERVER (artisan reverb:start) LISTEN di PATH DEFAULT ""
    #  -> artinya Reverb menerima request:        /app/{key}?...
    # Jadi Nginx harus STRIP prefix /ws terlebih dahulu sebelum proxy.
    # Solusi: rewrite ^/ws(.*) -> $1, URI /app/... dikirim ke Reverb :8082
    location /ws {
        rewrite ^/ws(.*) $1 break;
        set $reverb_upstream lab_reverb;
        proxy_pass http://$reverb_upstream:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── PHP-FPM (Load Balanced di Swarm) ─────────────────────────
    # Pakai tasks.lab_app (Docker Swarm DNS RR) — mengembalikan IP SEMUA
    # replica lab_app, sehingga nginx round-robin ke tiap replica PHP-FPM.
    location ~ \.php$ {
        set $php_upstream tasks.lab_app;
        fastcgi_pass $php_upstream:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 5s;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Blokir akses file tersembunyi ─────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}